<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dial Day</title>
<meta name="theme-color" content="#0f1724">
<meta name="description" content="Plan your day on a clock dial">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0f1724;--bg2:#1c2a44;--ink:#f3f5f9;--muted:rgba(255,255,255,.72);--card:rgba(255,255,255,.08);
    --line:rgba(255,255,255,.14);--face:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:background 1s;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow-x:hidden}
  header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 4px}
  .nav{display:flex;align-items:center;gap:6px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer}
  button.on{background:var(--ink);color:#111}
  .date{font-weight:600;font-size:17px;min-width:120px;text-align:center}
  .tools{width:100%;max-width:520px;display:flex;gap:6px;justify-content:center;padding:6px 16px;flex-wrap:wrap}
  .tools button{font-size:13px;padding:6px 10px}
  .wrap{width:100%;max-width:460px;padding:6px 12px;position:relative}
  svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
  .hint{color:var(--muted);font-size:13px;text-align:center;margin:2px 0 8px}
  .list{width:100%;max-width:480px;padding:0 16px 40px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
  .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .item .t{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;width:98px;flex:none}
  .item .n{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item.now{outline:2px solid var(--ink)}
  body.zen header,body.zen .tools,body.zen .list,body.zen .hint{display:none}
  body.zen .wrap{margin-top:8vh}
  .zenexit{display:none;position:fixed;top:12px;right:12px;opacity:.5}
  body.zen .zenexit{display:block}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
  .scrim.open{display:flex}
  .sheet{width:100%;max-width:480px;background:#1b2233;border-radius:18px 18px 0 0;padding:18px 18px 28px;border:1px solid var(--line)}
  .sheet h3{margin:0 0 12px;font-size:16px}
  .sheet input[type=text]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink)}
  .row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .row label{color:var(--muted);font-size:13px}
  .row input[type=time]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);color-scheme:dark}
  .sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .sw.sel{border-color:#fff}
  .actions{display:flex;gap:8px;margin-top:16px}
  .actions button{flex:1;padding:11px}
  .primary{background:#fff;color:#111;font-weight:600}
  .danger{color:#ff8f8f}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips button{font-size:12px;padding:5px 9px;border-radius:20px}
</style>
</head>
<body>
<button class="zenexit" id="zenExit">Exit zen</button>
<header>
  <button id="prev" aria-label="Previous day">‹</button>
  <div class="nav"><div class="date" id="dateLbl"></div></div>
  <button id="next" aria-label="Next day">›</button>
</header>
<div class="tools">
  <button id="today">Today</button>
  <button id="sky">Sky</button>
  <button id="zen">Zen</button>
</div>
<div class="wrap"><svg id="dial" viewBox="0 0 420 420"></svg></div>
<p class="hint" id="hint">Inner ring = AM · outer ring = PM<br>Drag round a ring to draw a block · tap a block to edit</p>
<div class="list" id="list"></div>

<div class="scrim" id="scrim">
  <div class="sheet">
    <h3 id="sheetTitle">New block</h3>
    <input type="text" id="fName" placeholder="What's this time for?" maxlength="40">
    <div class="chips" id="chips"></div>
    <div class="row">
      <label>From</label><input type="time" id="fStart" step="300">
      <label>to</label><input type="time" id="fEnd" step="300">
    </div>
    <div class="row" id="swatches"></div>
    <div class="actions">
      <button id="bDel" class="danger">Delete</button>
      <button id="bCancel">Cancel</button>
      <button id="bSave" class="primary">Save</button>
    </div>
  </div>
</div>

<script>
const COLOURS=['#ff7a7a','#ffb35c','#ffe066','#7ee08a','#5cc8ff','#8f8cff','#e38cff','#cfd6e4'];
const QUICK=['Focus','Meeting','Workout','Break','Lunch','Commute','Sleep','Admin'];
const C=210, SNAP=15;
// ring 0 = AM (inner), ring 1 = PM (outer)
const RINGS=[{in:84,out:132},{in:136,out:184}];RINGS.forEach(g=>{g.mid=(g.in+g.out)/2;g.w=g.out-g.in});
const $=id=>document.getElementById(id);
const svg=$('dial'), NS='http://www.w3.org/2000/svg';

// ---------- state ----------
let store={}; try{store=JSON.parse(localStorage.getItem('dialday')||'{}')}catch(e){}
let prefs=Object.assign({sky:true},store.__prefs||{});
let day=new Date(); day.setHours(0,0,0,0);
let editing=null; // {id|null, start, end, colour, name}
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const blocks=()=>store[dkey(day)]||(store[dkey(day)]=[]);
function save(){store.__prefs=prefs;try{localStorage.setItem('dialday',JSON.stringify(store))}catch(e){}}

// ---------- geometry ----------
const minToAng=m=>((m%720)/720)*2*Math.PI;          // 0 = top (12), clockwise
const pt=(r,a)=>[C+r*Math.sin(a),C-r*Math.cos(a)];
function arcPath(r,a0,a1){
  if(a1-a0>=2*Math.PI-1e-4)a1=a0+2*Math.PI-1e-4;
  const [x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1),large=(a1-a0)>Math.PI?1:0;
  return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}
function evtAng(e){
  const b=svg.getBoundingClientRect(),s=420/b.width;
  const x=(e.clientX-b.left)*s-C,y=(e.clientY-b.top)*s-C;
  let a=Math.atan2(x,-y); if(a<0)a+=2*Math.PI;
  return {a,r:Math.hypot(x,y)};
}
const fmt=m=>{m=((m%1440)+1440)%1440;const h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');return `${String(h).padStart(2,'0')}:${mm}`};
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()+n.getSeconds()/60};
const isToday=()=>dkey(day)===dkey(new Date());

// split a block into its AM and PM parts: [{ring,s,e}]
function segs(s,e){
  const out=[];
  if(s<720)out.push({ring:0,s,e:Math.min(e,720)});
  if(e>720)out.push({ring:1,s:Math.max(s,720),e});
  return out.filter(x=>x.e>x.s);
}
function segAngles(g){const a0=minToAng(g.s);let a1=minToAng(g.e);if(g.e%720===0)a1=2*Math.PI;return [a0,a1]}

// ---------- render ----------
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);(parent||svg).appendChild(n);return n}
let draft=null;
function render(){
  svg.innerHTML='';
  el('circle',{cx:C,cy:C,r:RINGS[1].out+24,fill:'var(--face)',stroke:'var(--line)'});
  RINGS.forEach((g,i)=>el('circle',{cx:C,cy:C,r:g.mid,fill:'none',stroke:i?'rgba(255,255,255,.05)':'rgba(255,255,255,.09)','stroke-width':g.w}));
  // ticks on outer edge + hour numbers
  for(let i=0;i<48;i++){
    const a=i/48*2*Math.PI,major=i%4===0;
    const [x0,y0]=pt(RINGS[1].out+2,a),[x1,y1]=pt(RINGS[1].out+(major?9:5),a);
    el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:major?'rgba(255,255,255,.55)':'rgba(255,255,255,.2)','stroke-width':major?2:1});
  }
  for(let h=0;h<12;h++){
    const a=h/12*2*Math.PI,[x,y]=pt(RINGS[1].out+17,a);
    const t=el('text',{x,y:y+4.5,'text-anchor':'middle','font-size':13,fill:'var(--muted)','font-weight':600});
    t.textContent=h===0?12:h;
  }
  // hour spokes through both rings (faint)
  for(let h=0;h<12;h++){const a=h/12*2*Math.PI,[x0,y0]=pt(RINGS[0].in,a),[x1,y1]=pt(RINGS[1].out,a);
    el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:'rgba(255,255,255,.07)','stroke-width':1})}
  // ring tags
  [['AM',0],['PM',1]].forEach(([l,i])=>{const t=el('text',{x:C,y:C-RINGS[i].mid+4,'text-anchor':'middle','font-size':10,'font-weight':700,fill:'rgba(255,255,255,.28)','pointer-events':'none'});t.textContent=l});
  // blocks
  blocks().slice().sort((a,b)=>a.start-b.start).forEach(b=>{
    segs(b.start,b.end).forEach(g=>{
      const R=RINGS[g.ring],[a0,a1]=segAngles(g);
      const p=el('path',{d:arcPath(R.mid,a0,a1),stroke:b.colour,'stroke-width':R.w-6,fill:'none',opacity:.9});
      p.dataset.id=b.id;p.style.cursor='pointer';
      if(a1-a0>0.4&&b.name){
        const [x,y]=pt(R.mid,(a0+a1)/2);
        const t=el('text',{x,y:y+4,'text-anchor':'middle','font-size':11,'font-weight':600,fill:'#111','pointer-events':'none'});
        t.textContent=b.name.length>10?b.name.slice(0,9)+'…':b.name;
      }
    });
  });
  if(draft){
    const s=Math.min(draft.s,draft.e),e=Math.max(draft.s,draft.e);
    segs(s,e).forEach(g=>{const R=RINGS[g.ring],[a0,a1]=segAngles(g);
      el('path',{d:arcPath(R.mid,a0,a1),stroke:'#fff','stroke-width':R.w-6,fill:'none',opacity:.5})});
  }
  // now hand: points to the current time on the right ring
  if(isToday()){
    const nm=nowMin(),R=RINGS[nm<720?0:1],a=minToAng(nm);
    const [x0,y0]=pt(58,a),[x1,y1]=pt(R.out,a);
    el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:'#fff','stroke-width':2.5,'stroke-linecap':'round','pointer-events':'none'});
    const [cx,cy]=pt(R.out,a);el('circle',{cx,cy,r:4.5,fill:'#fff','pointer-events':'none'});
  }
  // centre text
  const info=centreInfo();
  const t1=el('text',{x:C,y:C-14,'text-anchor':'middle','font-size':11,fill:'var(--muted)'});t1.textContent=info[0];
  const t2=el('text',{x:C,y:C+10,'text-anchor':'middle','font-size':20,'font-weight':700,fill:'var(--ink)'});t2.textContent=info[1];
  const t3=el('text',{x:C,y:C+28,'text-anchor':'middle','font-size':10,fill:'var(--muted)'});t3.textContent=info[2];
  renderList();
}
function dur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?`${h}h ${String(r).padStart(2,'0')}m`:`${r}m`}
function centreInfo(){
  const bs=blocks();
  if(!isToday()){const tot=bs.reduce((s,b)=>s+b.end-b.start,0);return [`${bs.length} block${bs.length===1?'':'s'}`,dur(tot),'planned']}
  const n=nowMin();
  const cur=bs.find(b=>b.start<=n&&b.end>n);
  if(cur)return [cur.name||'Now',dur(cur.end-n),'left'];
  const nx=bs.filter(b=>b.start>n).sort((a,b)=>a.start-b.start)[0];
  if(nx)return [`Next: ${nx.name||'block'}`,dur(nx.start-n),'to go'];
  return ['Free',fmt(Math.floor(n)),'nothing else today'];
}
function renderList(){
  const L=$('list');L.innerHTML='';const n=nowMin();
  blocks().slice().sort((a,b)=>a.start-b.start).forEach(b=>{
    const d=document.createElement('div');d.className='item'+(isToday()&&b.start<=n&&b.end>n?' now':'');
    d.innerHTML=`<span class="dot" style="background:${b.colour}"></span><span class="t">${fmt(b.start)}–${fmt(b.end)}</span><span class="n"></span>`;
    d.querySelector('.n').textContent=b.name||'Untitled';
    d.onclick=()=>openSheet(b);L.appendChild(d);
  });
}
function applySky(){
  if(!prefs.sky){document.body.style.background='';return}
  const h=nowMin()/60;let a,b;
  if(h<5||h>=21){a='#0b1020';b='#1a2140'}
  else if(h<7.5){a='#2b2d5a';b='#e48a6a'}
  else if(h<17){a='#2f6fb3';b='#7fb6e6'}
  else if(h<19.5){a='#4a3a78';b='#ee8f5d'}
  else{a='#151a3a';b='#3a3466'}
  document.body.style.background=`linear-gradient(180deg,${a},${b})`;
}
function syncUI(){
  $('dateLbl').textContent=day.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  $('sky').classList.toggle('on',prefs.sky);
  applySky();render();
}

// ---------- drawing ----------
let drag=null;
svg.addEventListener('pointerdown',e=>{
  const {a,r}=evtAng(e); if(r<RINGS[0].in-12||r>RINGS[1].out+30)return;
  svg.setPointerCapture(e.pointerId);
  const ring=r<(RINGS[0].out+RINGS[1].in)/2?0:1;
  const m=ring*720+a/(2*Math.PI)*720;
  drag={a0:a,last:a,acc:0,start:Math.round(m/SNAP)*SNAP,hit:e.target.dataset&&e.target.dataset.id,moved:false};
});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  const {a}=evtAng(e);let d=a-drag.last;
  if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
  drag.acc+=d;drag.last=a;
  if(Math.abs(drag.acc)>0.06)drag.moved=true;
  if(!drag.moved)return;
  let end=drag.start+Math.round(drag.acc/(2*Math.PI)*720/SNAP)*SNAP;
  end=Math.max(0,Math.min(1440,end));
  draft={s:Math.max(0,Math.min(1440,drag.start)),e:end};render();
});
function endDrag(){
  if(!drag)return;const d=drag;drag=null;
  if(!d.moved){
    draft=null;
    if(d.hit){const b=blocks().find(x=>x.id===d.hit);if(b)openSheet(b)}
    else{const s=Math.min(1440-SNAP,d.start);openSheet(null,s,s+60)}
    return;
  }
  const s=Math.min(draft.s,draft.e),e=Math.max(draft.s,draft.e);draft=null;
  if(e-s<SNAP){render();return}
  openSheet(null,s,e);
}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',()=>{drag=null;draft=null;render()});

// ---------- sheet ----------
let selColour=COLOURS[4];
function buildSwatches(){
  const w=$('swatches');w.innerHTML='';
  COLOURS.forEach(c=>{const s=document.createElement('div');s.className='sw'+(c===selColour?' sel':'');s.style.background=c;
    s.onclick=()=>{selColour=c;buildSwatches()};w.appendChild(s)});
}
QUICK.forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>{$('fName').value=q};$('chips').appendChild(b)});
function openSheet(b,s,e){
  editing=b?b.id:null;
  $('sheetTitle').textContent=b?'Edit block':'New block';
  $('fName').value=b?b.name:'';
  $('fStart').value=fmt(b?b.start:s);$('fEnd').value=b&&b.end===1440?'23:59':fmt(b?b.end:Math.min(e,1439));
  if(!b&&e===1440)$('fEnd').value='23:59';
  selColour=b?b.colour:COLOURS[blocks().length%COLOURS.length];
  $('bDel').style.display=b?'':'none';
  buildSwatches();$('scrim').classList.add('open');
  if(!b)setTimeout(()=>$('fName').focus(),50);
}
function closeSheet(){$('scrim').classList.remove('open');editing=null;render()}
$('bCancel').onclick=closeSheet;
$('scrim').onclick=e=>{if(e.target===$('scrim'))closeSheet()};
$('bSave').onclick=()=>{
  let s=toMin($('fStart').value||'00:00'),e=toMin($('fEnd').value||'00:00');
  if(e===1439)e=1440; if(e<=s)e=Math.min(1440,s+SNAP);
  const data={name:$('fName').value.trim(),start:s,end:e,colour:selColour};
  if(editing){Object.assign(blocks().find(x=>x.id===editing),data)}
  else blocks().push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5)},data));
  save();closeSheet();
};
$('bDel').onclick=()=>{const L=blocks();const i=L.findIndex(x=>x.id===editing);if(i>-1)L.splice(i,1);save();closeSheet()};
$('fName').addEventListener('keydown',e=>{if(e.key==='Enter')$('bSave').click()});

// ---------- controls ----------
const shift=n=>{day.setDate(day.getDate()+n);syncUI()};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('today').onclick=()=>{day=new Date();day.setHours(0,0,0,0);syncUI()};
$('sky').onclick=()=>{prefs.sky=!prefs.sky;save();syncUI()};
$('zen').onclick=()=>document.body.classList.add('zen');
$('zenExit').onclick=()=>document.body.classList.remove('zen');
// swipe between days on the list/hint area
let sx=null;document.addEventListener('touchstart',e=>{if(!svg.contains(e.target))sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(!$('scrim').classList.contains('open')&&Math.abs(dx)>70)shift(dx<0?1:-1)},{passive:true});

setInterval(()=>{if(!drag&&!$('scrim').classList.contains('open')){applySky();render()}},20000);
syncUI();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
